openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quotes
    description: Quote operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /responses:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List saved quotes, newest first
      responses:
        "200":
          description: Saved quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
  /generate:
    get:
      operationId: generateQuote
      tags: [quotes]
      summary: Generate and save a quote
      parameters:
        - name: rnumber
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{1,6}$'
      responses:
        "200":
          description: Generated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: Invalid seed
        "502":
          description: Quote source unavailable
  /print/{id}:
    get:
      operationId: printQuote
      tags: [quotes]
      summary: Printable quote page
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Printable HTML page
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Quote not found
components:
  schemas:
    Quote:
      type: object
      required: [quoteText, quoteAuthor, quoteLink, id]
      properties:
        quoteText:
          type: string
        quoteAuthor:
          type: string
        quoteLink:
          type: string
        id:
          type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

