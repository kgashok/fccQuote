kind = "slides"
previewPath = "/quote-generator-overview/"
title = "Quote Generator"
description = "A short overview of the random quote generator, its visitor flow, and how it runs."
version = "1.0.0"
id = "artifacts/quote-generator-overview"
router = "path"

[[services]]
name = "web"
paths = [ "/quote-generator-overview/" ]
localPort = 23936

[services.development]
run = "pnpm --filter @workspace/quote-generator-overview run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quote-generator-overview", "run", "build" ]
serve = "static"
publicDir = "artifacts/quote-generator-overview/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23936"
BASE_PATH = "/quote-generator-overview/"
