kind = "web"
previewPath = "/"
title = "Quote Generator"
description = "The existing quote generator for finding, saving, and printing memorable quotes."
version = "1.0.0"
id = "artifacts/quote-generator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23738

[services.development]
run = "pnpm --filter @workspace/quote-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quote-generator", "run", "build" ]
serve = "static"
publicDir = "artifacts/quote-generator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23738"
BASE_PATH = "/"
